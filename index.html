<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparador de Salário PT</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="app-actions">
        <button id="open-export" type="button" class="secondary"></button>
      </div>
      <section class="workspace">
        <aside class="panel controls-panel" aria-label="Configuração da proposta">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Portugal</p>
              <h1>Comparador salarial</h1>
            </div>
          </div>

          <p class="privacy-note">
            Os valores introduzidos são calculados apenas neste navegador. A aplicação não guarda dados, não usa cookies e não envia informação para servidores.
          </p>

          <div class="toolbar">
            <label>
              Proposta
              <select id="proposal-select"></select>
            </label>
            <button id="add-proposal" type="button">Adicionar</button>
            <button id="remove-proposal" type="button" class="secondary">Remover</button>
          </div>

          <form id="proposal-form" class="proposal-form"></form>

          <div class="settings-grid" aria-label="Premissas fiscais">
            <label class="toggle-row">
              <input id="rnh-enabled" type="checkbox">
              Limitar IRS por RNH
            </label>
            <label>
              Limite RNH (%)
              <input id="rnh-limit" type="number" min="0" max="100" step="0.01">
            </label>
            <label>
              Segurança Social (%)
              <input id="ss-rate" type="number" min="0" max="100" step="0.01">
            </label>
          </div>
        </aside>

        <section class="results-area" aria-label="Resultados">
          <section id="summary-results" aria-label="Resumo dos resultados"></section>
          <section id="detailed-results" aria-label="Resultados detalhados"></section>
        </section>
      </section>
    </main>

    <dialog id="export-dialog" aria-labelledby="export-dialog-title"></dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
