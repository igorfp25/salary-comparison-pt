<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparador de Salário PT</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="app-brand">
          <span class="app-brand-mark" aria-hidden="true">€</span>
          <div>
            <p class="eyebrow">Portugal</p>
            <h1>Comparador salarial</h1>
          </div>
        </div>
        <div class="app-actions">
          <button id="open-import" type="button" class="secondary"></button>
          <button id="open-export" type="button" class="secondary"></button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </header>
      <section class="workspace">
        <section id="configuration-panel" class="panel controls-panel" aria-label="Configuração da proposta">
          <header class="panel-header">
            <div>
              <h2>Configuração da proposta</h2>
              <p>Selecione uma proposta e atualize os respetivos valores.</p>
            </div>
            <div class="toolbar">
              <label>
                Proposta
                <select id="proposal-select"></select>
              </label>
              <button id="add-proposal" type="button">Nova simulação</button>
              <button id="remove-proposal" type="button" class="secondary">Remover</button>
              <button id="toggle-configuration" type="button" class="secondary" aria-controls="configuration-content" aria-expanded="true">Ocultar</button>
            </div>
          </header>

          <div id="configuration-content">
            <p class="privacy-note">
              Os valores introduzidos são calculados apenas neste navegador. A aplicação não guarda dados, não usa cookies e não envia informação para servidores.
            </p>

            <form id="proposal-form" class="proposal-form"></form>

            <div class="settings-grid" aria-label="Premissas fiscais">
              <label class="toggle-row">
                <input id="rnh-enabled" type="checkbox">
                Limitar IRS por RNH
              </label>
              <label>
                Limite RNH (%)
                <input id="rnh-limit" type="number" min="0" max="100" step="0.01">
              </label>
              <div class="fixed-setting">
                <span>Segurança Social (%)</span>
                <output id="ss-rate">11%</output>
              </div>
            </div>
          </div>
        </section>

        <section class="results-area" aria-label="Resultados">
          <section id="summary-results" aria-label="Resumo dos resultados"></section>
          <section id="detailed-results" aria-label="Resultados detalhados"></section>
        </section>
      </section>
    </main>

    <dialog id="export-dialog" aria-labelledby="export-dialog-title"></dialog>
    <dialog id="import-dialog" aria-labelledby="import-dialog-title"></dialog>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
